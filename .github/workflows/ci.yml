name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: 1

jobs:
  test:
    name: tests + parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt && pip install -e .
      - name: Tests (fast)
        run: python -m pytest -q -m "not slow"
      - name: Parity (quick)
        run: python scripts/check_parity.py --quick
