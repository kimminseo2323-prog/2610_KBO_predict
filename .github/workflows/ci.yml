name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: ci-${{ github.ref }}

permissions:
  contents: read

env:
  PYTHONUTF8: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt && pip install -e .
      - name: Tests (fast)
        run: python -m pytest -q -m "not slow"
      - name: Parity (quick)
        if: hashFiles('scripts/check_parity.py') != ''
        run: python scripts/check_parity.py --quick
