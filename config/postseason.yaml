# 포스트시즌 대진표 — simulate.py(load_postseason)가 읽는 설정 파일.
# 미정(null)으로 둔 팀·시작일은 simulate.resolve_undecided가 데이터에서 채운다: 바로 앞 시리즈의 승자 + 두 팀의 첫 맞대결 날짜.
# (한국시리즈 teams: [KT, null], start: null → 플레이오프가 끝나고 일정이 잡히면 자동으로 들어간다.) 직접 적은 값은 그대로 쓴다.
# 시즌(정수) -> 시리즈 목록. 각 시리즈:
#   name:    시리즈 이름 (사이트에 그대로 나간다)
#   teams:   [팀0, 팀1] 팀 코드 (teams.TEAMS). 아직 정해지지 않은 팀은 null → 그 시리즈는 건너뛴다.
#   best_of: 시리즈 길이 — (best_of // 2 + 1)승을 먼저 하면 이긴다 (5판 3선승이면 5).
#   head_start: (선택) [팀0, 팀1] 시작할 때 안고 들어가는 승수. 없으면 [0, 0].
#            와일드카드 결정전: 4위 팀이 1승을 안고 시작하는 2선승제 → best_of: 3, head_start: [1, 0] (팀0 = 4위).
#            4위는 1승만 더 하면 올라가고, 5위는 2경기를 모두 이겨야 한다.
#            head_start 승수는 전적(wins)에 처음부터 들어가지만 경기가 아니므로 homes에는 칸이 없다.
#   start:   1차전 날짜 (YYYY-MM-DD). 미정이면 null → 건너뛴다. 이 날짜부터의 두 팀 FINAL 경기를 시리즈 전적으로 센다.
#   homes:   1차전부터 차례로 각 경기의 홈 팀 코드 (실제 경기 수 = best_of − sum(head_start) 개). 미정 칸은 null.
#            없으면 모든 경기를 팀0 홈으로 본다.
# 취소 경기는 전적에 들어가지 않고, 다음 경기가 같은 순번(같은 홈)으로 다시 치러진다고 본다.
2026:
  - name: 와일드카드
    teams: [LG, OB]
    best_of: 3
    head_start: [1, 0]   # 4위 LG 1승 어드밴티지 — LG는 1승, 두산(OB)은 2승이 더 필요하다
    start: 2026-10-14
    homes: [LG, LG]      # 4위 LG가 두 경기 모두 홈
  - name: 준플레이오프
    teams: [HT, LG]
    best_of: 5
    start: 2026-10-17
    homes: [HT, HT, LG, LG, HT]
  - name: 플레이오프
    teams: [SS, HT]
    best_of: 5
    start: 2026-10-25
    homes: [SS, SS, HT, HT, SS]
  - name: 한국시리즈
    teams: [KT, null]
    best_of: 7
    start: null
    homes: [KT, KT, null, null, KT, null, KT]
