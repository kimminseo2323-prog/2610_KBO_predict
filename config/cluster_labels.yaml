# 선수 유형 이름 — cluster.py가 읽는 설정 파일. 유형 번호는 models/clusters.pkl(clusters-2026b)의 K-means 라벨.
# 이름은 유형 중심(cluster center)의 스탯 프로파일을 보고 사람이 붙였다 (2026-10-29, Task 4 프로파일 표 기준).
# 타자 번호는 ISO 내림차순, 투수 번호는 선발 비중 내림차순(동률 시 K%)으로 정렬돼 있어 재적합 뒤에도 의미가 유지된다.
# 2026-11-03 clusters-2026b: 타자 피처를 바꿔(HR% 제외, 도루율 로그) 다시 맞췄고, 타자 이름·설명을 새 중심으로 다시 붙였다(투수는 그대로).
batter:
  0:
    name: 파워형
    blurb: ISO .213, 타석당 홈런 4.4%로 장타력이 가장 높고 볼넷(11.5%)도 가장 잘 골라 출루율(.384)이 가장 높은 중심 타자 유형.
  1:
    name: 하위 타선형
    blurb: 타율 .241, 출루율 .317로 네 유형 중 가장 낮고, 맞힌 공이 안타가 되는 비율(BABIP .287)도 가장 낮다. 장타는 중간(ISO .123), 출전이 적은 선수가 많다(평균 333타석).
  2:
    name: 컨택형
    blurb: 삼진 13%로 가장 적고 타율(.301)이 가장 높은, 공을 맞히는 데 강점이 있는 테이블세터·교타자 유형. 홈런은 드물다.
  3:
    name: 주루형
    blurb: 1루 도달 기회당 도루 .162로 압도적인 발 빠른 유형. 장타(ISO .108)는 가장 적다.
pitcher:
  0:
    name: 선발형
    blurb: 등판의 96%가 선발. 볼넷 8.6%로 제구가 안정적이고 긴 이닝을 책임지는 유형.
  1:
    name: 스윙맨형
    blurb: 선발 비중 29%로 선발과 롱릴리프를 오간다. 삼진은 적고 피홈런(3.6%)이 많은 편.
  2:
    name: 제구 불안 불펜형
    blurb: 거의 구원 등판(선발 8.5%). 볼넷 12.9%로 가장 많지만 피BABIP .265로 정타는 가장 덜 맞는 불펜 유형.
  3:
    name: 삼진 불펜형
    blurb: 구원 전담(선발 4.3%)에 삼진 20%로 가장 높은, 짧은 이닝을 삼진으로 막는 필승조 유형.
