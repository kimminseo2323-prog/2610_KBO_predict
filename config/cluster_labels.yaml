# 선수 유형 이름 — cluster.py가 읽는 설정 파일. 유형 번호는 models/clusters.pkl(clusters-2026)의 K-means 라벨.
# 이름은 유형 중심(cluster center)의 스탯 프로파일을 보고 사람이 붙였다 (2026-10-29, Task 4 프로파일 표 기준).
# 타자 번호는 HR/PA 내림차순, 투수 번호는 선발 비중 내림차순(동률 시 K%)으로 정렬돼 있어 재적합 뒤에도 의미가 유지된다.
batter:
  0:
    name: 파워형
    blurb: 타석당 홈런 4.9%, ISO .229로 장타력이 가장 높고 볼넷(11%)도 잘 고르는 중심 타자 유형.
  1:
    name: 장타 지향형
    blurb: 삼진 22%로 가장 많고 볼넷은 적지만 ISO .138로 장타를 노리는, 거칠지만 힘 있는 타자 유형.
  2:
    name: 컨택형
    blurb: 삼진 13.5%로 가장 적고 홈런은 드문, 공을 맞히는 데 강점이 있는 테이블세터·교타자 유형.
  3:
    name: 주루형
    blurb: 1루 도달 기회당 도루 .186으로 압도적인 발 빠른 유형. 장타는 적다.
pitcher:
  0:
    name: 선발형
    blurb: 등판의 96%가 선발. 볼넷 8.6%로 제구가 안정적이고 긴 이닝을 책임지는 유형.
  1:
    name: 스윙맨형
    blurb: 선발 비중 29%로 선발과 롱릴리프를 오간다. 삼진은 적고 피홈런(3.6%)이 많은 편.
  2:
    name: 파워 불펜형
    blurb: 거의 구원 등판(선발 8.5%). 볼넷 12.9%로 제구는 흔들리지만 피BABIP .265로 정타를 덜 맞는 힘 있는 불펜.
  3:
    name: 삼진 불펜형
    blurb: 구원 전담(선발 4.3%)에 삼진 20%로 가장 높은, 짧은 이닝을 삼진으로 막는 필승조 유형.
